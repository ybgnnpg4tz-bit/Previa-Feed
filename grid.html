<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia do feed</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
<style>
:root{--bg:#0c1014;--ink:#f5f5f5;--mute:#a8a8a8;--line:#262a2f;--card:#25292e;--blue:#0095f6;--plan:#ffb020}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:#000;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}
.bar{position:sticky;top:0;z-index:5;background:rgba(12,16,20,.95);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.btn{min-height:36px;padding:0 12px;border-radius:8px;border:0;background:var(--card);font-weight:600;font-size:13px}
.btn.on{background:#fff;color:#000}
.btn.pri{background:var(--blue);color:#fff}
.top{text-align:center;padding:14px 16px 4px;font-size:20px;font-weight:700}
.head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;padding:12px 16px}
.av{width:90px;height:90px;border-radius:50%;background:var(--card) center/cover no-repeat;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--mute)}
.nm{font-weight:600;margin:0 0 6px;white-space:pre-line}
.stats{display:flex;gap:18px}.stats b{display:block;font-size:17px}.stats span{font-size:14px}
.bio{padding:0 16px 12px;white-space:pre-line;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;border-top:1px solid var(--line);padding-top:2px}
.t{position:relative;aspect-ratio:3/4;background:var(--card);overflow:hidden;border:0;padding:0;display:block;width:100%;color:var(--mute);font-size:12px;text-align:left}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t .txt{position:absolute;inset:0;padding:30px 8px 8px;display:flex;align-items:flex-end}
.t .tag{position:absolute;left:6px;top:6px;background:var(--plan);color:#1a1200;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.t .ic{position:absolute;top:7px;right:7px;width:18px;height:18px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.t.past{opacity:.92}
.clean .tag{display:none}
.msg{padding:40px 24px;text-align:center;color:var(--mute)}
.panel{display:none;padding:12px 14px;border-bottom:1px solid var(--line);background:#14181c}
.panel.open{display:block}
.panel h3{font-size:13px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.panel input[type=text],.panel textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.note{font-size:12px;color:var(--mute);padding:10px 14px 18px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <button class="btn" id="bClean">Ver como cliente</button>
    <button class="btn" id="bCfg">Ajustes</button>
    <span class="sp"></span>
    <button class="btn" id="bPng">Baixar imagem</button>
  </div>
  <div class="panel" id="panel">
    <h3>Listas que entram na grade</h3>
    <div id="lists"></div>
    <h3>Dados do perfil (aparecem no topo)</h3>
    <input type="text" id="fU" placeholder="usuário, ex.: joanacosta.lash">
    <input type="text" id="fN" placeholder="Nome que aparece no perfil">
    <textarea id="fB" rows="3" placeholder="Bio"></textarea>
    <div class="three"><input type="text" id="fP" placeholder="Posts"><input type="text" id="fF" placeholder="Seguidores"><input type="text" id="fS" placeholder="Seguindo"></div>
    <button class="btn pri" id="fOk">Salvar ajustes</button>
  </div>
  <div class="top" id="user"></div>
  <div class="head"><div class="av" id="av"></div><div><p class="nm" id="nm"></p>
    <div class="stats"><div><b id="sP">–</b><span>posts</span></div><div><b id="sF">–</b><span>seguidores</span></div><div><b id="sS">–</b><span>seguindo</span></div></div></div></div>
  <div class="bio" id="bio"></div>
  <div class="grid" id="grid"><div class="msg" style="grid-column:1/-1">Carregando…</div></div>
  <div class="note" id="note"></div>
</div>
<script>
(function () {
  var C = window.PREVIA_CONFIG;
  var t = window.TrelloPowerUp.iframe({ appKey: C.appKey, appName: C.appName });
  var api = t.getRestApi();
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ICON = {
    reels: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5v7l6-3.5z" fill="currentColor" stroke="none"/></svg>',
    carrossel: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M4 7v12a2 2 0 0 0 2 2h12" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    pin: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M15 3l6 6-3 1-4 4 .5 4.5L13 20l-4-4-5 5-1-1 5-5-4-4 1.5-1.5L10 10l4-4z"/></svg>'
  };
  var token = null, settings = {}, allLists = [], items = [], clean = false;
  var cache = {}; // attachment id -> object URL

  // ---------- helpers ----------
  function parseDate(name) {
    var m = /^\s*\[?\s*(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/.exec(name || '');
    if (!m) return null;
    var now = new Date(), d = +m[1], mo = +m[2] - 1, y = m[3] ? +m[3] : now.getFullYear();
    if (y < 100) y += 2000;
    if (!m[3]) { if (mo - now.getMonth() > 6) y--; else if (now.getMonth() - mo > 6) y++; }
    return new Date(y, mo, d);
  }
  function kind(name) {
    if (/re+l+s|reels|v[ií]deo|vlog/i.test(name)) return 'reels';
    if (/carrossel|carousel|dump/i.test(name)) return 'carrossel';
    return '';
  }
  function isImage(a) {
    return a && (/^image\//.test(a.mimeType || '') || /\.(png|jpe?g|webp|gif|heic)$/i.test(a.name || a.url || ''));
  }
  function pickAttachment(card) {
    var atts = card.attachments || [];
    var id = card.cover && card.cover.idAttachment;
    var cov = id && atts.filter(function (a) { return a.id === id; })[0];
    if (cov) return cov;
    var sorted = atts.slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
    return sorted.filter(isImage)[0] || null;
  }
  function bestUrl(a) {
    var pv = (a.previews || []).filter(function (p) { return p.width >= 400; }).sort(function (x, y) { return x.width - y.width; })[0];
    return (pv && pv.url) || a.url;
  }
  function loadImage(a) {
    if (cache[a.id]) return Promise.resolve(cache[a.id]);
    var url = bestUrl(a);
    if (!/^https:\/\/(api\.)?trello\.com\/1\//.test(url)) { cache[a.id] = url; return Promise.resolve(url); }
    url = url.replace('https://trello.com/1/', 'https://api.trello.com/1/');
    return fetch(url, { headers: { Authorization: 'OAuth oauth_consumer_key="' + C.appKey + '", oauth_token="' + token + '"' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) { cache[a.id] = URL.createObjectURL(b); return cache[a.id]; });
  }
  // runs image loads a few at a time
  function queue(tasks, n) {
    var i = 0;
    function next() { if (i >= tasks.length) return Promise.resolve(); var f = tasks[i++]; return f().catch(function () {}).then(next); }
    var w = []; for (var k = 0; k < n; k++) w.push(next()); return Promise.all(w);
  }

  // ---------- render ----------
  function renderProfile() {
    var p = settings.perfil || {};
    $('user').textContent = p.user || 'Prévia do feed';
    $('nm').textContent = p.name || '';
    $('bio').textContent = p.bio || '';
    $('sP').textContent = p.posts || '–'; $('sF').textContent = p.followers || '–'; $('sS').textContent = p.following || '–';
    if (!settings.avatarUrl) $('av').textContent = (p.user || '?').charAt(0).toUpperCase();
  }
  function fmt(d) { return d ? ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) : ''; }
  function renderGrid() {
    document.body.classList.toggle('clean', clean);
    if (!items.length) { $('grid').innerHTML = '<div class="msg" style="grid-column:1/-1">Nenhum cartão com data nas listas escolhidas. Toque em Ajustes para escolher as listas.</div>'; return; }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    $('grid').innerHTML = items.map(function (it) {
      var img = it.att && cache[it.att.id] ? '<img src="' + esc(cache[it.att.id]) + '" alt="">' : '<div class="txt">' + esc(it.title) + '</div>';
      var ic = it.pinned ? ICON.pin : (ICON[it.kind] || '');
      var past = it.date && it.date < today;
      var tag = it.date ? '<span class="tag">' + fmt(it.date) + (past ? ' · postado' : '') + '</span>' : '';
      return '<button class="t' + (past ? ' past' : '') + '" data-id="' + esc(it.id) + '" title="' + esc(it.title) + '">' + img + ic + tag + '</button>';
    }).join('');
    var semImg = items.filter(function (it) { return !it.att; }).length;
    $('note').textContent = items.length + ' posts na prévia' + (semImg ? ' · ' + semImg + ' ainda sem capa' : '') + '. O post mais recente fica no topo, como no Instagram.';
  }
  function renderLists() {
    var sel = settings.listas;
    $('lists').innerHTML = allLists.map(function (l) {
      var on = sel ? sel.indexOf(l.id) >= 0 : C.listasPadrao.test(l.name);
      return '<label class="chk"><input type="checkbox" value="' + esc(l.id) + '"' + (on ? ' checked' : '') + '>' + esc(l.name) + '</label>';
    }).join('');
  }

  // ---------- data ----------
  function load() {
    return Promise.all([
      t.lists('id', 'name'),
      t.cards('id', 'name', 'idList', 'pos', 'cover', 'attachments', 'labels', 'closed'),
      t.get('board', 'shared')
    ]).then(function (r) {
      allLists = r[0]; settings = r[2] || {};
      var cards = r[1].filter(function (c) { return !c.closed; });
      var chosen = settings.listas || allLists.filter(function (l) { return C.listasPadrao.test(l.name); }).map(function (l) { return l.id; });
      var order = {}; allLists.forEach(function (l, i) { order[l.id] = i; });

      var avatarCard = cards.filter(function (c) { return /foto de perfil/i.test(c.name); })[0];
      var avatarAtt = avatarCard && pickAttachment(avatarCard);

      items = cards.filter(function (c) { return chosen.indexOf(c.idList) >= 0 && !/^\s*\/\//.test(c.name); })
        .map(function (c) {
          return {
            id: c.id, title: c.name, date: parseDate(c.name), kind: kind(c.name), att: pickAttachment(c),
            pinned: (c.labels || []).some(function (l) { return C.etiquetaFixado.test(l.name || ''); }),
            lo: order[c.idList], pos: c.pos
          };
        })
        .filter(function (it) { return it.date || it.pinned; })
        .sort(function (a, b) {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          var da = a.date ? a.date.getTime() : 0, db = b.date ? b.date.getTime() : 0;
          if (da !== db) return db - da; // newest first
          return (b.lo - a.lo) || (b.pos - a.pos);
        });

      renderProfile(); renderLists(); renderGrid();
      var tasks = items.filter(function (it) { return it.att && !cache[it.att.id]; })
        .map(function (it) { return function () { return loadImage(it.att).then(renderGrid); }; });
      if (avatarAtt) tasks.unshift(function () { return loadImage(avatarAtt).then(function (u) { settings.avatarUrl = u; $('av').style.backgroundImage = 'url("' + u + '")'; $('av').textContent = ''; }); });
      return queue(tasks, 4).then(renderGrid);
    }).catch(function (e) {
      $('grid').innerHTML = '<div class="msg" style="grid-column:1/-1">Não consegui ler o quadro (' + esc(e && e.message) + ').</div>';
    });
  }

  function askAuth() {
    $('grid').innerHTML = '<div class="msg" style="grid-column:1/-1"><p>Para mostrar as capas, o Power-Up precisa da sua permissão para ler os anexos deste quadro (só leitura). É uma vez só.</p><button class="btn pri" id="bAuth">Autorizar</button></div>';
    $('bAuth').addEventListener('click', function () {
      api.authorize({ scope: 'read', expiration: 'never' })
        .then(function (tk) { token = tk; t.render(function () { load(); }); })
        .catch(function () { $('note').textContent = 'A autorização não foi concluída. Tente de novo.'; });
    });
  }

  // ---------- events ----------
  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest('.t'); if (b) t.showCard(b.getAttribute('data-id'));
  });
  $('bClean').addEventListener('click', function () { clean = !clean; this.classList.toggle('on', clean); renderGrid(); });
  $('bCfg').addEventListener('click', function () {
    var p = settings.perfil || {};
    $('fU').value = p.user || ''; $('fN').value = p.name || ''; $('fB').value = p.bio || '';
    $('fP').value = p.posts || ''; $('fF').value = p.followers || ''; $('fS').value = p.following || '';
    $('panel').classList.toggle('open');
  });
  $('fOk').addEventListener('click', function () {
    var listas = [].slice.call($('lists').querySelectorAll('input:checked')).map(function (i) { return i.value; });
    var perfil = { user: $('fU').value.trim(), name: $('fN').value.trim(), bio: $('fB').value.slice(0, 300), posts: $('fP').value.trim(), followers: $('fF').value.trim(), following: $('fS').value.trim() };
    t.set('board', 'shared', { listas: listas, perfil: perfil })
      .then(function () { $('panel').classList.remove('open'); return load(); })
      .catch(function () { $('note').textContent = 'Só quem é membro do quadro consegue salvar os ajustes.'; });
  });

  // PNG export of the clean view
  function drawCover(ctx, img, x, y, w, h) {
    if (!img) { ctx.fillStyle = '#25292e'; ctx.fillRect(x, y, w, h); return; }
    var r = Math.max(w / img.width, h / img.height), sw = w / r, sh = h / r;
    ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
  }
  function imgEl(src) { return new Promise(function (ok) { if (!src) return ok(null); var i = new Image(); i.onload = function () { ok(i); }; i.onerror = function () { ok(null); }; i.src = src; }); }
  $('bPng').addEventListener('click', function () {
    var p = settings.perfil || {}, W = 1080, tw = (W - 4) / 3, th = tw * 4 / 3;
    var list = items.slice(0, 15), rows = Math.max(1, Math.ceil(list.length / 3)), head = 300;
    var c = document.createElement('canvas'), ctx = c.getContext('2d');
    c.width = W; c.height = Math.round(head + rows * (th + 2));
    var F = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
    Promise.all([imgEl(settings.avatarUrl)].concat(list.map(function (it) { return imgEl(it.att && cache[it.att.id]); }))).then(function (imgs) {
      ctx.fillStyle = '#0c1014'; ctx.fillRect(0, 0, W, c.height);
      ctx.fillStyle = '#f5f5f5'; ctx.textAlign = 'center'; ctx.font = '700 44px ' + F; ctx.fillText(p.user || '', W / 2, 70);
      ctx.save(); ctx.beginPath(); ctx.arc(135, 190, 95, 0, Math.PI * 2); ctx.clip(); drawCover(ctx, imgs[0], 40, 95, 190, 190); ctx.restore();
      ctx.textAlign = 'left';
      [[p.posts, 'posts'], [p.followers, 'seguidores'], [p.following, 'seguindo']].forEach(function (s, i) {
        var x = 300 + i * 250; ctx.font = '700 44px ' + F; ctx.fillText(s[0] || '–', x, 180); ctx.font = '32px ' + F; ctx.fillText(s[1], x, 225);
      });
      list.forEach(function (it, i) { drawCover(ctx, imgs[i + 1], (i % 3) * (tw + 2), head + Math.floor(i / 3) * (th + 2), tw, th); });
      c.toBlob(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'feed-' + (p.user || 'cliente') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
      }, 'image/png');
    });
  });

  // ---------- start ----------
  api.getToken().then(function (tk) {
    token = tk;
    if (!tk) return askAuth();
    t.render(function () { load(); }); // refresh whenever the board changes
  }).catch(askAuth);
})();
</script>
</body>
</html>
